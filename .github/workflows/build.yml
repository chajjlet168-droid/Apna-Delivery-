name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android Project
        run: |
          unzip -o Apna_Delivery_Android_Project.zip -d android-project
          find android-project -maxdepth 3 -type f | head -30

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle wrapper
        run: |
          find android-project -name gradlew -type f

      - name: Make gradlew executable
        run: |
          chmod +x $(find android-project -name gradlew -type f | head -1)

      - name: Build Debug APK
        run: |
          GRADLEW=$(find android-project -name gradlew -type f | head -1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apna-Delivery-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
